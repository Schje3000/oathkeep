<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="assets/icon-180.png?v=2">

<title>Oathkeep</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1512;--panel:#18211c;--panel2:#212d26;--line:rgba(255,255,255,.09);--text:#f1f4ea;--mut:#9aa694;--gold:#e8c860;--green:#a9c957;--red:#ef8a6f;--px:'VT323',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 6px}
header h1{margin:0;font-family:var(--px);font-size:24px;font-weight:700;letter-spacing:.5px}
header .lv{font:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--panel2);border:1px solid var(--line);min-height:44px;padding:0 14px 0 8px;border-radius:99px;display:flex;align-items:center;gap:6px;cursor:pointer}
header .lv svg{width:26px;height:26px}
header .lv[aria-current="true"]{background:var(--gold);color:#16261A;border-color:transparent}
main{flex:1;padding:10px 16px 110px;display:flex;flex-direction:column;gap:14px}
nav{position:fixed;left:0;right:0;bottom:0;padding:0 12px 12px;pointer-events:none}
nav div{max-width:456px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);background:rgba(28,38,32,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:6px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.45)}
nav button{height:54px;background:none;border:0;border-radius:16px;color:var(--mut);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:#16261A;background:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.gold{border-color:rgba(232,200,96,.55)}
.row{display:flex;align-items:center;gap:10px}
.row>.grow{flex:1;min-width:0}
.t{font-size:17px;font-weight:650}
.s{font-size:13px;color:var(--mut)}
.warn{color:var(--red)}
.ok{color:var(--green)}
button.b{min-height:46px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:transform .08s}
button.b.pri{background:var(--gold);color:#16261A;border-color:transparent}
button.b:disabled{opacity:.4}
button.b:active{transform:scale(.97)}
input,select,textarea{min-height:46px;padding:8px 12px;background:#0c110e;color:var(--text);border:1px solid var(--line);border-radius:14px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input[type=number]{width:96px}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.g i{background:var(--gold)}
canvas{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:20px;background:#4C7DA6}
canvas.pv{max-width:260px;margin:0 auto}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font:inherit;font-size:14px;font-weight:600;color:var(--text);text-align:left;cursor:pointer;min-height:56px}
.tile.wide{grid-column:1/-1}
.tile[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2)}
.back{align-self:flex-start;display:flex;align-items:center;gap:6px}
.back svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{font-size:13px;font-weight:600;color:#16261A;background:var(--gold);padding:5px 12px;border-radius:99px;white-space:nowrap}
.tile b{display:block;font-size:11px;letter-spacing:.6px;color:var(--mut);font-weight:600;margin-bottom:2px}
.invw{display:flex;flex-direction:column;gap:8px}
.inv{display:flex;gap:8px}
.slot{flex:1;min-height:44px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;cursor:pointer}
.slot svg{width:22px;height:22px}
.slot[aria-pressed="true"]{border-color:var(--gold)}
.slot .n{font-size:14px;font-weight:700}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.sw button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.sw button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,200,96,.35)}
.sw button:disabled{opacity:.3}
#toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:var(--gold);color:#16261A;font-size:14px;font-weight:650;padding:11px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;display:none;z-index:5;text-align:center}
ul.log{margin:0;padding:0;list-style:none;font-size:14px;color:var(--mut)}
ul.log li{padding:6px 0;border-bottom:1px solid var(--line)}

html,body{height:100%;overflow:hidden;background:#0b0f0d}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;min-height:0;margin:0 auto;overflow:hidden;display:block}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:0;object-fit:cover}
#hud{position:absolute;top:0;left:0;right:0;z-index:2;padding:12px 14px 30px;display:flex;align-items:center;gap:8px;background:linear-gradient(rgba(8,12,10,.78),rgba(8,12,10,0));pointer-events:none}
#hud>*{pointer-events:auto}
#hud .grow{flex:1}
.logo{font-family:var(--px);font-size:24px;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.55)}
.chip{min-height:44px;padding:0 14px;border-radius:99px;background:rgba(18,26,22,.84);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--text);font:inherit;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.chip svg{width:22px;height:22px;flex:none}
.chip svg.st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip .pill{padding:3px 10px;font-size:12px}
span.chip{cursor:default}
#float{position:absolute;right:14px;top:74px;z-index:2;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.ev{border-radius:18px;padding:8px 14px 8px 10px;text-align:left}
.ev b{display:block;font-size:14px}
.ev small{display:block;font-size:12px;font-weight:500;color:var(--mut)}
.ev.hot{border-color:rgba(232,200,96,.7)}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;background:rgba(13,19,16,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px 14px 20px;display:flex;flex-direction:column;gap:12px;max-height:58%;overflow-y:auto}
#sheet.full{top:calc(72px + env(safe-area-inset-top));max-height:none;min-height:0}
#sheet.room{max-height:46%}
#sheet .card{background:rgba(255,255,255,.045);border-radius:18px;padding:14px}
#sheet .tile{background:rgba(255,255,255,.045);min-height:52px;padding:8px 10px}
#toast{bottom:auto;top:74px}

/* Holz-Stil */
:root{--text:#f6ead0;--mut:#cdb48c;--green:#a4e070;--red:#ff9d80;--gold:#f0cf6a;--w1:#3b2414;--w2:#4d2f1a;--w3:#6e4526;--w4:#9a6638;--wd:#1e1108;--g1:#9be06a;--g2:#62b440;--g3:#3c7f2a}
.t{font-family:var(--px);font-size:19px;font-weight:700;letter-spacing:.3px}
.ok{color:var(--green)}
#sheet{background:var(--w2);background-image:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 46px,rgba(0,0,0,.22) 46px 48px),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 3px,rgba(0,0,0,0) 3px 9px);-webkit-backdrop-filter:none;backdrop-filter:none;border:0;border-top:5px solid var(--w4);box-shadow:0 -3px 0 var(--wd),inset 0 3px 0 rgba(255,255,255,.08);border-radius:22px 22px 0 0}
#sheet .card,.card{background:var(--w1);border:3px solid var(--w3);border-radius:14px;box-shadow:0 3px 0 var(--wd),inset 0 0 0 2px rgba(0,0,0,.35),inset 0 4px 0 rgba(255,255,255,.04)}
#sheet .card.gold,.card.gold{border-color:#c9a23c}
button.b{font-family:var(--px);font-size:17px;font-weight:700;min-height:48px;border-radius:12px;border:3px solid var(--w3);background:linear-gradient(#7a4e2c,#5a371f);color:var(--text);box-shadow:0 4px 0 var(--wd),inset 0 2px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.22)}
button.b.pri{background:linear-gradient(var(--g1),var(--g2));color:#12340a;border-color:var(--w3);box-shadow:0 4px 0 var(--wd),inset 0 0 0 2px var(--g3),inset 0 5px 0 rgba(255,255,255,.38),inset 0 -4px 0 rgba(0,0,0,.14)}
button.b:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wd),inset 0 2px 0 rgba(255,255,255,.16)}
button.b:disabled{opacity:1;filter:saturate(.25) brightness(.72)}
.bar{height:20px;background:#22130a;border:3px solid var(--w3);border-radius:9px;box-shadow:0 3px 0 var(--wd),inset 0 2px 0 rgba(0,0,0,.5);padding:2px;overflow:hidden}
.bar i{border-radius:4px;background:repeating-linear-gradient(90deg,var(--g2) 0 26px,rgba(0,0,0,0) 26px 29px);box-shadow:inset 0 4px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.15)}
.bar.g i{background:repeating-linear-gradient(90deg,#e9a23a 0 26px,rgba(0,0,0,0) 26px 29px)}
#sheet .tile,.tile{background:linear-gradient(#6a4226,#4f3019);border:3px solid var(--w4);border-radius:12px;box-shadow:0 4px 0 var(--wd),inset 0 2px 0 rgba(255,255,255,.12);font-size:15px;min-height:58px}
.tile b{color:#e2c79a;font-family:var(--px);font-size:12px;letter-spacing:1px}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wd)}
.chip{background:linear-gradient(#5c3920,#40260f);border:3px solid var(--w4);box-shadow:0 3px 0 var(--wd),inset 0 2px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:none;backdrop-filter:none;font-family:var(--px);font-size:16px;border-radius:14px}
.ev{border-radius:14px}
.ev small{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#e2c79a}
.ev.hot{border-color:var(--gold)}
.pill{background:linear-gradient(var(--g1),var(--g2));color:#12340a;border:2px solid var(--g3);font-family:var(--px)}
input,select,textarea{background:#22130a;border:3px solid var(--w3);border-radius:10px;color:var(--text);box-shadow:inset 0 2px 0 rgba(0,0,0,.45)}
label{color:#e2c79a}
.s{color:var(--mut)}
ul.log li{border-bottom:2px solid rgba(0,0,0,.3)}
#toast{background:linear-gradient(var(--g1),var(--g2));color:#12340a;border:3px solid var(--w3);box-shadow:0 4px 0 var(--wd),inset 0 0 0 2px var(--g3);font-family:var(--px);font-size:16px;border-radius:12px}
.sw button{border:3px solid var(--w3);box-shadow:0 3px 0 var(--wd)}
.sw button[aria-pressed="true"]{border-color:var(--g1);box-shadow:0 0 0 3px var(--g3)}
canvas.pv{border:3px solid var(--w4);border-radius:12px;box-shadow:0 3px 0 var(--wd)}
#hud{background:linear-gradient(rgba(20,10,4,.6),rgba(20,10,4,0))}

.tabs{display:flex;gap:8px}
.tab{flex:1;min-height:48px;font-family:var(--px);font-size:17px;font-weight:700;color:var(--text);border-radius:12px;border:3px solid var(--w3);background:linear-gradient(#7a4e2c,#5a371f);box-shadow:0 4px 0 var(--wd),inset 0 2px 0 rgba(255,255,255,.16);cursor:pointer}
.tab[aria-pressed="true"]{background:linear-gradient(var(--g1),var(--g2));color:#12340a;box-shadow:0 4px 0 var(--wd),inset 0 0 0 2px var(--g3),inset 0 5px 0 rgba(255,255,255,.38)}
.pill.bad{background:linear-gradient(#f0a27a,#d9694a);border-color:#8a2e22;color:#3a0f08}
/* Homescreen-App: Abstand zu Notch und Home-Leiste */
#hud{padding-top:calc(12px + env(safe-area-inset-top))}
#float{top:calc(74px + env(safe-area-inset-top))}
#sheet{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
ul.tlog li{display:flex;align-items:center;gap:10px;padding:4px 0}
.b.sm{min-height:44px;padding:0 12px;font-size:13px;flex:none}
.b.warnb{color:#ffd9c8}
/* Pixelschrift VT323: nur eine Strichstärke, wirkt kleiner als Pixelify Sans */
header h1,.logo{font-size:32px;font-weight:400;letter-spacing:.5px}
.t{font-size:25px;font-weight:400;letter-spacing:.3px;line-height:1.05}
button.b,.tab{font-size:23px;font-weight:400;letter-spacing:.3px}
.b.sm{font-size:19px}
.tile b{font-size:17px;font-weight:400}
.chip{font-size:21px;font-weight:400}
.pill{font-size:17px;font-weight:400}
#toast{font-size:21px;font-weight:400}
.chip.gold{gap:6px;padding:0 12px}
.chip.gold svg{width:20px;height:20px}
/* iOS zoomt bei Eingabefeldern unter 16 px */
input,select,textarea{font-size:16px!important}
.ic{width:24px;height:24px;image-rendering:pixelated;flex:none;vertical-align:middle}
.chip .ic{width:26px;height:26px}
.tile .ic{width:28px;height:28px;float:right;margin:-2px -2px 0 4px}
.card .row>.ic{width:32px;height:32px}
.eqrow{align-items:center;gap:10px}
.eqrow.sub{padding-left:20px}
.slot{width:44px;height:44px;flex:none;border-radius:10px;background:rgba(0,0,0,.28);border:2px solid var(--w3);display:flex;align-items:center;justify-content:center}
.slot img{width:36px;height:36px;object-fit:contain;image-rendering:pixelated}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.gi{background:rgba(0,0,0,.22);border:2px solid var(--w3);border-radius:10px;padding:6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.gi img{width:44px;height:44px;object-fit:contain;image-rendering:pixelated}
.gi span{font-family:var(--px);font-size:17px;line-height:1}
.gi small{color:var(--mut);font-size:11px;line-height:1.2}
.gi.lock img{filter:brightness(0) opacity(.35)}
.card.lvl{text-align:center;border:3px solid var(--gold)}
.card.lvl .ic{width:56px;height:56px}
.t.big{font-size:32px;color:var(--gold)}
.pv{width:144px;height:128px;image-rendering:pixelated;display:block;margin:0 auto 8px;border-radius:12px}
#sheet{max-height:48%;min-height:34%}
.chip.map{gap:6px;padding:0 12px}
.chip.map span{font-size:18px}
</style>
</head>
<body>
<div id="app">
<canvas id="cv" width="360" height="640" role="img" aria-label="Ansicht deiner Burg"></canvas>
<div id="hud"></div>
<div id="float"></div>
<div id="sheet"></div>
<div id="toast" role="status"></div>
</div>
<script>
'use strict';
var DAY=86400000;
var SK={aus:'Ausdauer',sta:'Stärke',kla:'Klang-Magie',hau:'Hauswacht',kra:'Kräuterkunde',wis:'Wissen'};
var CHORES=[{k:'kueche',n:'Burgküche schrubben',d:7},{k:'bad',n:'Waschraum scheuern',d:7},{k:'saugen',n:'Halle fegen',d:7},{k:'staub',n:'Gemächer entstauben',d:7},{k:'bett',n:'Lager frisch beziehen',d:21}];
var KIND={run:{s:'aus',n:'Ausdauertraining',area:'run'},gym:{s:'sta',n:'Kampftraining',area:'gym'},piano:{s:'kla',n:'Piano',area:'piano'},water:{s:'kra',n:'Garten bewässern'},waesche:{s:'hau',n:'Gewänder waschen'},read:{s:'wis',n:'Schriften studieren'},book:{s:'wis',n:'Buch vollendet',area:'read'}};
CHORES.forEach(function(c){KIND[c.k]={s:'hau',n:c.n,area:'home'};});
var AREA={run:{n:'Ausdauertraining',u:'km'},gym:{n:'Kampftraining',u:'Einheiten'},piano:{n:'Piano',u:'Minuten'},home:{n:'Haushalt',u:'Aufgaben'},read:{n:'Lesen',u:'Bücher'}};
var LOOK={
 skin:[['#f0c9a4'],['#e0b08a'],['#b98058'],['#7a4f32']],
 hair:[['#2a1c12'],['#5b3a22'],['#b8964a'],['#c9552e'],['#d8dde0']],
 armor:[['#8e9aa0'],['#4f5a60'],['#a8703a'],['#E8C860','boss','erste Eroberung']],
 cape:[['none'],['#b33a2e','aus',3,'Ausdauer Stufe 3'],['#2f5fa6','aus',6,'Ausdauer Stufe 6'],['#6B4FA0','kla',4,'Klang-Magie Stufe 4']],
 plume:[['none'],['#d9482e','sta',3,'Stärke Stufe 3'],['#EDF0D8','sta',6,'Stärke Stufe 6']]
};
var LOOKN={skin:'Haut',hair:'Haar',armor:'Rüstung',cape:'Umhang',plume:'Helmbusch'};

function fresh(){var n=Date.now();return{v:1,updatedAt:0,created:n,name:'Held',
 look:{skin:'#e0b08a',hair:'#5b3a22',armor:'#8e9aa0',cape:'none',plume:'none'},
 xp:{aus:0,sta:0,kla:0,hau:0,kra:0,wis:0},books:[],stones:5,gold:25,potions:0,buff:false,buffUntil:0,raidN:0,lvlSeen:1,wall:{lvl:1,dmg:0},up:{thron:0,halle:0,turm:0,bib:0,garten:0,hof:0},inv:[],equip:{waffe:'',ruestung:'',talisman:''},loot:[],
 last:{run:n,gym:n,piano:0,water:n,kueche:n,bad:n,saugen:n,staub:n,bett:n,waesche:0,read:0,book:0},
 log:[],runGoal:50,rest:0,lastRaid:n,raids:[],
 bosses:[{id:'gp',name:'Der Aarewyrm',goal:'GP von Bern',area:'run',date:'2027-05-15',target:300,dmg:0,done:false,won:false}]};}
function migrate(o){var d=fresh();if(!o||typeof o!=='object')return d;
 if(o.gold===undefined){o.gold=Math.round((o.stones||0)*5);o.raidN=(o.raids||[]).length;if(o.buff){o.buffUntil=Date.now()+DAY;o.buff=false;}o.lvlSeen=charLvlOf(o.xp||{});}
 if(!o.up&&o.xp){var ol=function(k){return Math.floor(Math.sqrt((o.xp[k]||0)/30))+1;};o.up={thron:4,halle:Math.min(3,ol('hau')-1),turm:Math.min(3,ol('kla')-1),bib:Math.min(3,Math.floor((o.books||[]).length/3)),garten:Math.min(3,ol('kra')-1),hof:0};}for(var k in d){if(o[k]===undefined)o[k]=d[k];}
 ['look','xp','wall','last','up','equip'].forEach(function(g){for(var k in d[g]){if(o[g][k]===undefined)o[g][k]=d[g][k];}});return o;}

var S=fresh(),ui={tab:'burg',km:'5',min:'15',confirm:'',imp:'',inv:'',mtab:'ansturm',ttab:'kampf',unc:'',room:'mauer',rmin:'20',btitle:''},sync='lokal',docRef=null,saving=false,pending=false,saveTimer=null;
try{var raw=localStorage.getItem('oathkeep');if(raw)S=migrate(JSON.parse(raw));}catch(e){}

function saveLocal(){try{localStorage.setItem('oathkeep',JSON.stringify(S));}catch(e){}}
function save(){S.updatedAt=Date.now();if(S.log.length>400)S.log=S.log.slice(-400);if(S.raids.length>12)S.raids=S.raids.slice(-12);saveLocal();if(docRef){clearTimeout(saveTimer);saveTimer=setTimeout(push,1200);}}
function push(){if(!docRef)return;if(saving){pending=true;return;}saving=true;
 docRef.set({json:JSON.stringify(S),updatedAt:S.updatedAt}).then(function(){sync='konto';},function(){sync='lokal';}).then(function(){saving=false;if(pending){pending=false;push();}});}
function initSync(){try{if(!window.claude||!window.claude.use)return;

function eff(){return S.rest||Date.now();}
function since(ts){return ts?(eff()-ts)/DAY:999;}
function dkey(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function weekStart(t){var d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
function lvl(x){return Math.floor(Math.sqrt(x/30))+1;}
function lvlProg(x){var l=lvl(x),a=30*(l-1)*(l-1),b=30*l*l;return{l:l,cur:x-a,need:b-a};}
function totalXp(xp){var s=0;for(var k in SK)s+=xp[k]||0;return s;}
function charLvlOf(xp){return Math.floor(Math.sqrt(totalXp(xp)/150))+1;}
function charLvl(){return charLvlOf(S.xp);}
function charProg(){var l=charLvl(),a=150*(l-1)*(l-1),b=150*l*l;return{l:l,cur:totalXp(S.xp)-a,need:b-a};}
function buffOn(){return S.buffUntil>Date.now();}
function goldCat(k){return {run:'run',gym:'gym',piano:'piano',water:'water',read:'read',book:'read'}[k]||'home';}
function goldMul(k){return (buffOn()?1.5:1)*(1+(typeof eqBonus==='function'?eqBonus('gold_'+goldCat(k))+eqBonus('gold'):0));}
function potPrice(){return Math.max(15,40-3*(lvl(S.xp.kra)-1));}
function raidAtk(){return Math.min(150,40+2*S.raidN);}
function moder(){var m=0;CHORES.forEach(function(c){if(since(S.last[c.k])>c.d)m++;});return m;}
function plant(){var d=since(S.last.water);return d<3.5?0:d<6?1:d<9?2:3;}
function fit(){var d=Math.min(since(S.last.run),since(S.last.gym));return d<4?0:d<7?1:2;}
function tower(){var d=since(S.last.piano);return d<1.5?2:d<3.5?1:0;}
function happy(){return moder()===0&&plant()===0&&S.wall.dmg===0;}
function inWeek(k){var w=weekStart(Date.now());return S.log.filter(function(e){return e.t>=w&&(k.indexOf(e.k)>=0);});}
function pianoDays(){var o={};inWeek(['piano']).forEach(function(e){o[dkey(e.t)]=1;});return Object.keys(o).length;}
function monthKm(){var d=new Date();return S.log.reduce(function(s,e){var x=new Date(e.t);return s+(e.k==='run'&&x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear()?e.a:0);},0);}
function todayXp(s){var k=dkey(Date.now());return S.log.reduce(function(a,e){return a+(e.s===s&&dkey(e.t)===k?e.x:0);},0);}
function num(n){return (Math.round(n*10)/10).toLocaleString('de-CH');}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function bossHasWon(){return S.bosses.some(function(b){return b.done;});}
function unlocked(o){if(!o[1])return true;if(o[1]==='boss')return bossHasWon();return lvl(S.xp[o[1]])>=o[2];}
function unlockText(o){return o[1]==='boss'?o[2]:o[3];}

var toastT=null;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){t.style.display='none';},2600);}

function logAct(k,a){
 if(S.rest){toast('Rast am Lagerfeuer aktiv. Beende sie zuerst.');return;}
 var K=KIND[k],now=Date.now(),td=todayXp(K.s),x=0,st=1;
 if(k==='run'){if(!(a>0)||a>100){toast('Bitte Kilometer eingeben.');return;}x=Math.min(Math.round(a*12),Math.max(0,200-td));st=2;}
 else if(k==='gym'){a=1;x=td>=50?0:50;st=2;}
 else if(k==='piano'){if(!(a>0)||a>600){toast('Bitte Minuten eingeben.');return;}x=Math.min(Math.round(a*2),Math.max(0,80-td));}
 else if(k==='water'){a=1;x=td>=25?0:25;}
 else if(k==='waesche'){a=1;x=Math.min(15,Math.max(0,150-td));}
 else if(k==='read'){if(!(a>0)||a>600){toast('Bitte Minuten eingeben.');return;}x=Math.min(Math.round(a),Math.max(0,60-td));}
 else if(k==='book'){a=1;x=80;st=3;}
 else{a=1;x=Math.min(30,Math.max(0,150-td));st=2;}
 var bf=0,po=0,g=Math.round(x/5*goldMul(k));
 var before=lvl(S.xp[K.s]),hits=[];
 S.xp[K.s]+=x;S.gold+=g;
 if(K.area)S.bosses.forEach(function(b){if(!b.done&&b.area===K.area){b.dmg+=a;hits.push(b.id);}});
 S.log.push({t:now,k:k,a:a,s:K.s,x:x,g:g,st:0,pl:S.last[k],b:hits,bf:bf,po:po});S.last[k]=now;if(k==='book'){S.books.push({t:now,n:String(ui.btitle||'').slice(0,60)});ui.btitle='';}
 save();render();
 var after=lvl(S.xp[K.s]);
 toast(after>before?SK[K.s]+' erreicht Stufe '+after+'!':K.n+': +'+x+' Ruhm, +'+g+' Gold');
}
function undoEntry(t){var i,e=null;for(i=S.log.length-1;i>=0;i--){if(S.log[i].t===t){e=S.log[i];break;}}if(!e)return false;
 S.log.splice(i,1);S.xp[e.s]=Math.max(0,S.xp[e.s]-e.x);S.gold=Math.max(0,S.gold-(e.g!==undefined?e.g:(e.st||0)*5));if(e.po)S.potions=Math.max(0,S.potions-1);
 if(S.last[e.k]===e.t){var lt=0;S.log.forEach(function(o){if(o.k===e.k&&o.t>lt)lt=o.t;});S.last[e.k]=lt||e.pl;}
 if(e.k==='book'){for(i=S.books.length-1;i>=0;i--){if(S.books[i].t===e.t){S.books.splice(i,1);break;}}}
 (e.b||[]).forEach(function(id){S.bosses.forEach(function(b){if(b.id===id)b.dmg=Math.max(0,b.dmg-e.a);});});
 save();return true;}
function undo(){var e=S.log[S.log.length-1];if(!e||dkey(e.t)!==dkey(Date.now())){toast('Nur Einträge von heute lassen sich zurücknehmen.');return;}
 undoEntry(e.t);render();toast('Letzter Eintrag zurückgenommen');}
function nextRaid(after){var d=new Date(after);d.setHours(20,0,0,0);d.setDate(d.getDate()+((7-d.getDay())%7));if(d.getTime()<=after)d.setDate(d.getDate()+7);return d.getTime();}
function raids(){if(S.rest)return;var now=Date.now(),nr=nextRaid(S.lastRaid),n=0,msg='';
 while(nr<=now&&n<8){var c=S.log.filter(function(e){return e.t>nr-7*DAY&&e.t<=nr;}).length;
  var def=S.wall.lvl*10+c*4-moder()*5-S.wall.dmg*5+(typeof eqBonus==='function'?eqBonus('def'):0),atk=raidAtk(),win=def>=atk;S.raidN++;
  if(win){S.gold+=20;var le=lootRoll('raid');msg='Ansturm abgewehrt: +20 Gold'+(le.items.length||le.gold?', Beute: '+lootText(le):'');}else{S.wall.dmg=Math.min(5,S.wall.dmg+1);msg='Die Horde hat die Mauer beschädigt';}
  S.raids.push({t:nr,win:win,def:def,atk:atk});S.lastRaid=nr;nr=nextRaid(nr);n++;}

 if(p[0]==='look'){S.look[p[1]]=p.slice(2).join(':');save();render();return;}
 if(a==='boss:add'){var f=function(id){return document.getElementById(id).value.trim();};var nm=f('bn'),gl=f('bg'),dt=f('bd'),tg=parseFloat(f('bt'));

 if(p[0]==='boss'&&p[1]==='hit'){S.bosses.forEach(function(b){if(b.id===p[2]&&!b.done){b.done=true;b.won=b.dmg>=b.target;if(b.won){S.gold+=150;var le=lootRoll('boss');toast(b.name+' ist erobert, ein Dorf entsteht: +150 Gold, Beute: '+lootText(le));}else toast(b.name+' ist gescheitert. Kein Dorf, keine Beute.');}});save();render();return;}
